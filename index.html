<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>Multi - Platform Media Downloader</title>
    <b:skin><![CDATA[
      /* 这里可以添加你的CSS样式 */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }
      h1 {
        color: #333;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .bg-white {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      button:hover {
        opacity: 0.9;
      }
      .bg-red-500 {
        background-color: #ef4444;
        color: #fff;
      }
      .bg-blue-500 {
        background-color: #3b82f6;
        color: #fff;
      }
      .bg-green-500 {
        background-color: #22c55e;
        color: #fff;
      }
      .bg-yellow-500 {
        background-color: #eab308;
        color: #fff;
      }
    ]]></b:skin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <b:section class="main-section" id="main-section" showaddelement="yes">
        <div class="container mx-auto p-4">
            <h1 class="text-3xl font-bold text-center mb-4">Multi-Platform Media Downloader</h1>
            <div class="bg-white p-6 rounded shadow-md">
                <div class="mb-4">
                    <label for="links" class="block text-sm font-medium text-gray-700">Paste links here (one per line):</label>
                    <textarea id="links" class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" rows="4"></textarea>
                </div>
                <div class="mb-4">
                    <label for="cookies" class="block text-sm font-medium text-gray-700">Paste cookies here (for restricted content):</label>
                    <textarea id="cookies" class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" rows="2"></textarea>
                </div>
                <div class="mb-4">
                    <label for="resolution" class="block text-sm font-medium text-gray-700">Select Video Resolution:</label>
                    <select id="resolution" class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="144p">144p</option>
                        <option value="240p">240p</option>
                        <option value="360p">360p</option>
                        <option value="480p">480p</option>
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </div>
                <div class="flex space-x-4">
                    <button id="clear-links" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded">Clear Links</button>
                    <button id="paste-links" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">Paste Links</button>
                    <button id="start-download" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded">Download</button>
                    <button id="stop-download" class="bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded">Stop Download</button>
                </div>
            </div>
            <div class="mt-4 bg-white p-6 rounded shadow-md">
                <h2 class="text-xl font-bold mb-2">Download Status</h2>
                <p id="status-message" class="text-gray-700">No downloads in progress.</p>
                <p id="download-counter" class="text-gray-700">Downloaded: 0</p>
            </div>
        </div>
    </b:section>

    <script>
        const linksTextarea = document.getElementById('links');
        const cookiesTextarea = document.getElementById('cookies');
        const clearLinksButton = document.getElementById('clear-links');
        const pasteLinksButton = document.getElementById('paste-links');
        const startDownloadButton = document.getElementById('start-download');
        const stopDownloadButton = document.getElementById('stop-download');
        const statusMessage = document.getElementById('status-message');
        const downloadCounter = document.getElementById('download-counter');
        const resolutionSelect = document.getElementById('resolution');

        let downloadInProgress = false;
        let downloadCount = 0;

        clearLinksButton.addEventListener('click', () => {
            linksTextarea.value = '';
        });

        pasteLinksButton.addEventListener('click', async () => {
            try {
                const clipboardText = await navigator.clipboard.readText();
                linksTextarea.value = clipboardText;
            } catch (error) {
                console.error('Failed to read clipboard:', error);
            }
        });

        startDownloadButton.addEventListener('click', async () => {
            if (downloadInProgress) return;
            downloadInProgress = true;
            const links = linksTextarea.value.split('\n').filter(link => link.trim()!== '');
            const cookies = cookiesTextarea.value;
            const resolution = resolutionSelect.value;

            if (links.length === 0) {
                statusMessage.textContent = 'No links provided.';
                return;
            }

            statusMessage.textContent = 'Downloading...';
            downloadCount = 0;
            downloadCounter.textContent = `Downloaded: ${downloadCount}`;

            for (const link of links) {
                if (!downloadInProgress) break;
                const platform = detectPlatform(link);
                const videoId = getVideoIdFromLink(link);
                statusMessage.textContent = `Downloading ${videoId} from ${platform} in ${resolution}...`;

                try {
                    const response = await fetch('/download', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            link: link,
                            cookies: cookies,
                            resolution: resolution
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.download_url) {
                            const a = document.createElement('a');
                            a.href = data.download_url;
                            a.download = `${videoId}.mp4`;
                            a.click();
                        }
                    } else {
                        console.error('Download failed:', await response.text());
                    }
                } catch (error) {
                    console.error('Error during download:', error);
                }

                downloadCount++;
                downloadCounter.textContent = `Downloaded: ${downloadCount}`;
            }

            if (downloadCount === links.length) {
                statusMessage.textContent = 'All downloads completed.';
                downloadInProgress = false;
                console.log('Opening save folder...');
            }
        });

        stopDownloadButton.addEventListener('click', () => {
            downloadInProgress = false;
            statusMessage.textContent = 'Download stopped.';
        });

        function getVideoIdFromLink(link) {
            // 简单示例，需要根据不同平台完善
            return `video_${Math.random().toString(36).substring(7)}`;
        }

        function detectPlatform(link) {
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                return 'YouTube';
            } else if (link.includes('soundcloud.com')) {
                return 'SoundCloud';
            } else if (link.includes('facebook.com')) {
                return 'Facebook';
            } else if (link.includes('twitter.com')) {
                return 'Twitter';
            } else if (link.includes('instagram.com')) {
                return 'Instagram';
            } else if (link.includes('tiktok.com')) {
                return 'TikTok';
            } else if (link.includes('vimeo.com')) {
                return 'Vimeo';
            } else if (link.includes('dailymotion.com')) {
                return 'Dailymotion';
            } else if (link.includes('vk.com')) {
                return 'VK';
            }
            return 'Unknown';
        }
    </script>
</body>

</html>
